# pre-commit hooks:  pip install pre-commit  (or: uv tool install pre-commit)  &&  pre-commit install
# Run on everything: pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]   # --unsafe: Compose !override / !reset tags
      - id: check-json
        exclude: '(tsconfig.*\.json|\.vscode/.*\.json)$'   # JSONC
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: '\.ps1$'
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/ai-service/
      - id: ruff-format
        files: ^services/ai-service/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
