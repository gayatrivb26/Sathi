# Alembic for schema `ai` (owner: ai-service). Run from the service root: `alembic upgrade head`.
# The database URL comes from DATABASE_URL (or `-x dburl=...`); it is never stored here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = {"timestamp": "%(asctime)s", "level": "%(levelname)s", "service": "migrator-ai", "event": "migration.%(name)s", "message": "%(message)s"}
datefmt = %Y-%m-%dT%H:%M:%S
