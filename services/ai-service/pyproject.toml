[project]
name = "sathi-ai-service"
version = "0.1.0"
description = "Sathi AI service: live tutor (RAG + web search), ingestion, quiz generation, grading, mastery, evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0,<2",
    "fastapi>=0.143.3,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "sqlalchemy[asyncio]>=2.0.55,<2.1",  # opentelemetry-instrumentation-sqlalchemy supports < 2.1
    "psycopg[binary]>=3.3.6,<4",
    "pgvector>=0.5.1,<0.6",
    "alembic>=1.20.0,<2",
    "structlog>=26.1.0",
    "pyjwt[crypto]>=2.15.1,<3",
    "httpx>=0.28.1,<0.29",
    "fastembed>=0.9.0,<0.10",
    "numpy>=2.0",
    "pypdf>=6.21.0,<7",
    "python-docx>=1.2.0,<2",
    "boto3>=1.43.0,<2",
    "beautifulsoup4>=4.15.0,<5",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1,<2",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-logging",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "boto3-stubs[s3]",
    "types-beautifulsoup4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
ignore = [
    "S101",   # assert in tests
    "S311",   # pseudo-random is fine for non-crypto jitter
    "B008",   # FastAPI Depends() in defaults
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in prompts/messages is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "ASYNC", "PT011", "PT018", "RUF015"]
"migrations/**" = ["E501", "S608"]
"app/search/fetcher.py" = ["ASYNC109"]  # httpcore network-backend interface takes `timeout`

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*", "docx.*", "pypdf.*", "opentelemetry.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["db: needs a real Postgres + pgvector (TEST_DATABASE_URL or Docker)"]
