# OpenTelemetry Collector (contrib) — single gateway for all Sathi telemetry.
#
#   apps (OTLP grpc :4317 / http :4318)
#     -> memory_limiter -> redaction (attributes + transform) -> [tail_sampling] -> batch
#     -> traces: Tempo (OTLP grpc)   logs: Loki 3 native OTLP (/otlp)   metrics: Prometheus exporter (:8889)
#
# Production: swap the exporters (e.g. Azure Monitor, Grafana Cloud) — apps do not change.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB:-400}
    spike_limit_mib: 80

  # Defence in depth: the apps already redact (contracts.md §8). Drop attributes that
  # must never be stored, whatever an SDK or auto-instrumentation decides to record.
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.request.header.x-xsrf-token, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: user.email, action: delete }
      - { key: enduser.id, action: delete }
      - { key: db.query.parameters, action: delete }
      - { key: password, action: delete }
      - { key: token, action: delete }
      - { key: api_key, action: delete }
      - { key: authorization, action: delete }
      - { key: cookie, action: delete }
      - { key: email, action: delete }
      - { key: prompt, action: delete }
      - { key: completion, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }

  # Mask secret-looking values anywhere (log bodies, span/log attributes).
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
          - replace_all_patterns(attributes, "value", "(?i)bearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{8,}", "[REDACTED_KEY]")
          - replace_pattern(attributes["url.query"], "(?i)(token|code|password|secret|key)=[^&]*", "$$1=[REDACTED]")
          - replace_pattern(attributes["url.full"], "(?i)(token|code|password|secret|key)=[^&]*", "$$1=[REDACTED]")
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]") where IsString(body)
          - replace_pattern(body, "(?i)bearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]") where IsString(body)
          - replace_pattern(body, "sk-[A-Za-z0-9_-]{8,}", "[REDACTED_KEY]") where IsString(body)
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
          - replace_all_patterns(attributes, "value", "(?i)bearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{8,}", "[REDACTED_KEY]")
          # Exact-ish key match so metrics-like fields such as input_tokens survive.
          - delete_matching_keys(attributes, "(?i)^(.*[._-])?(password|passwd|secret|token|access_token|refresh_token|id_token|authorization|cookie|set-cookie|api[_-]?key)$$")

  # Keep every error trace and every slow trace; sample the rest (dev 100 %, prod 20 %).
  tail_sampling:
    decision_wait: 5s
    num_traces: 20000
    expected_new_traces_per_sec: 50
    policies:
      - name: keep-errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: keep-slow
        type: latency
        latency: { threshold_ms: 2000 }
      - name: sample-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT:-100}

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 2000
    retry_on_failure:
      enabled: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    sending_queue:
      queue_size: 2000
    retry_on_failure:
      enabled: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ""
    send_timestamps: false
    metric_expiration: 10m
    enable_open_metrics: true
    # Exposes e.g. http_server_request_duration_seconds_bucket, sathi_ai_cost_usd_total.
    add_metric_suffixes: true
    resource_to_telemetry_conversion:
      enabled: false

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact, tail_sampling, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
