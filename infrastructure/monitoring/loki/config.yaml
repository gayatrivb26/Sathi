# Loki 3 — single binary, filesystem storage, native OTLP ingestion at /otlp.
# Logs arrive from the OTel Collector. Resource attribute service.name becomes the
# `service_name` label; trace_id / span_id and log attributes become structured
# metadata (queryable with `| trace_id="..."` without blowing up label cardinality).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  log_format: json

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  max_query_lookback: ${LOKI_RETENTION_PERIOD:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - deployment.environment.name

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

pattern_ingester:
  enabled: false

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
