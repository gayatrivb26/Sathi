# Sathi edge: serves the Angular build and reverse-proxies the backend (contracts.md §1).
# Copied by apps/web/Dockerfile to /etc/nginx/conf.d/default.conf (nginx-unprivileged,
# included inside the `http {}` block, so http-level directives are allowed here).
#
#   /api/...        -> http://api:8080   (SSE stream location: no buffering, 300 s)
#   /hangfire...    -> http://jobs:8080  (dashboard, Admin role enforced by the jobs host)
#   /nginx-health   -> 200 "ok" (container health check)
#   everything else -> static file or SPA fallback /index.html

# ---------------------------------------------------------------------------
# Docker's embedded DNS. Upstreams are resolved per request through variables, so nginx
# starts (and serves the SPA) even when api/jobs are down or not yet created.
# Outside Docker (e.g. Azure Container Apps) change the resolver / upstream host names.
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server_tokens off;

# ---------------------------------------------------------------------------
# Correlation (contracts.md §4)
# ---------------------------------------------------------------------------
# Keep a well-formed incoming X-Request-Id, otherwise use nginx's own 32-hex $request_id.
map $http_x_request_id $sathi_request_id {
    default                     $request_id;
    "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
}

# Forward a valid W3C traceparent unchanged; otherwise start a trace at the edge whose
# trace id is $request_id (so nginx and application logs share the id).
map $http_traceparent $sathi_traceparent {
    default                                              "00-${request_id}-${sathi_edge_span_id}-01";
    "~^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$" $http_traceparent;
}
map $request_id $sathi_edge_span_id {
    default          "00f067aa0ba902b7";
    "~^.{16}(?<half>.{16})$" $half;
}
map $sathi_traceparent $sathi_trace_id {
    default                                         "";
    "~^[0-9a-f]{2}-(?<tid>[0-9a-f]{32})-"           $tid;
}

# Honour X-Forwarded-Proto from a TLS-terminating load balancer in front of nginx.
map $http_x_forwarded_proto $sathi_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# HSTS only when the original request was HTTPS (empty value => header not sent).
map $sathi_forwarded_proto $sathi_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

# ---------------------------------------------------------------------------
# Caching: hashed build output is immutable, index.html / SPA routes are revalidated,
# API responses keep whatever the backend sends (empty => no header added).
# ---------------------------------------------------------------------------
map $uri $sathi_cache_control {
    default                                                                   "no-cache";
    "~^/api/"                                                                 "";
    "~^/hangfire"                                                             "";
    "~*-[A-Za-z0-9]{8,}\.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$" "public, max-age=31536000, immutable";
    "~^/(?:assets|media)/"                                                    "public, max-age=86400";
    "~*(?:ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest)$" "no-cache";
}

# ---------------------------------------------------------------------------
# Content-Security-Policy
#  - self + Google Fonts; data:/blob: images; inline styles (Angular Material / CDK)
#  - the sha256 hash allows Angular's critical-CSS loader  onload="this.media='all'"
#  - Hangfire's dashboard ships inline scripts, so it gets its own (admin-only) policy
# ---------------------------------------------------------------------------
map $uri $sathi_csp {
    default     "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    "~^/hangfire" "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# ---------------------------------------------------------------------------
# Rate limits at the edge (coarse, per client IP). The API enforces the exact
# per-endpoint limits (contracts.md §5); these stop floods before they reach it.
# Only state-changing auth calls are counted (GET /auth/csrf and /auth/me are not).
# ---------------------------------------------------------------------------
map $request_method $sathi_auth_limit_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
limit_req_zone $sathi_auth_limit_key zone=sathi_auth:10m          rate=20r/m;
limit_req_zone $binary_remote_addr   zone=sathi_client_errors:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# Bearer tokens in URL paths (class invites, guardian consent, staff invites -
# contracts.md 11.1, 11.2, 11.4) are replaced before the path is logged.
# ---------------------------------------------------------------------------
map $uri $sathi_log_path {
    "~^(?<tp>/api/v1/classes/invites/)[^/]+(?<ts>.*)$"    "${tp}REDACTED${ts}";
    "~^(?<tp>/api/v1/guardian-consent/)[^/]+(?<ts>.*)$"   "${tp}REDACTED${ts}";
    "~^(?<tp>/api/v1/auth/staff-invites/)[^/]+(?<ts>.*)$" "${tp}REDACTED${ts}";
    "~^(?<tp>/join/)[^/]+(?<ts>.*)$"                      "${tp}REDACTED${ts}";
    "~^(?<tp>/consent/)[^/]+(?<ts>.*)$"                   "${tp}REDACTED${ts}";
    default $uri;
}

# ---------------------------------------------------------------------------
# Structured JSON access log — same field names as the application log schema
# (docs/architecture/logging.md). $uri (not $request_uri): query strings can carry
# verification / reset tokens and must never be logged; path tokens are redacted above.
# ---------------------------------------------------------------------------
log_format sathi_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"level":"info",'
        '"service":"web",'
        '"event":"http.request",'
        '"message":"$request_method $sathi_log_path $status",'
        '"request_id":"$sathi_request_id",'
        '"trace_id":"$sathi_trace_id",'
        '"traceparent_in":"$http_traceparent",'
        '"http_method":"$request_method",'
        '"http_path":"$sathi_log_path",'
        '"http_status":$status,'
        '"request_time_s":$request_time,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"client_ip":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"user_agent":"$http_user_agent",'
        '"rate_limited":"$limit_req_status"'
    '}';

# ---------------------------------------------------------------------------
# Compression (never for text/event-stream — gzip buffers and would break streaming)
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml application/javascript application/json
    application/problem+json application/manifest+json application/xml
    image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log sathi_json;
    error_log  /var/log/nginx/error.log warn;

    # Uploads are capped at 25 MB by the API (Quotas__MaxUploadBytes); leave room for multipart overhead.
    client_max_body_size 26m;
    client_body_timeout  60s;
    send_timeout         60s;

    # ---- headers on every response (no add_header inside locations: it would reset these)
    add_header X-Request-Id              $sathi_request_id always;
    add_header Cache-Control             $sathi_cache_control always;
    add_header Content-Security-Policy   $sathi_csp always;
    add_header Strict-Transport-Security $sathi_hsts always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- common proxy settings (inherited by every location that proxies)
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sathi_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $sathi_request_id;
    proxy_set_header traceparent       $sathi_traceparent;
    proxy_set_header tracestate        $http_tracestate;
    # The upstream echoes X-Request-Id too; send exactly one copy (ours, same value).
    proxy_hide_header X-Request-Id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Friendly ProblemDetails when nginx itself cannot reach api/jobs (contracts.md §4.1).
    error_page 502 503 504 = @upstream_unavailable;
    error_page 429 = @rate_limited;

    # ------------------------------------------------------------------ health
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------ API
    # ^~ : prefix wins over the static-file regex below (API paths may contain dots).
    location ^~ /api/ {
        set $sathi_api http://api:8080;
        proxy_pass $sathi_api;

        # Tutor SSE stream: unbuffered, long-lived (contracts.md §5.3.1, keep-alive ping every 15 s).
        location ~ ^/api/v1/conversations/.+/messages/stream$ {
            # `set` is not inherited by nested locations.
            set $sathi_api http://api:8080;
            proxy_pass $sathi_api;

            proxy_buffering         off;
            proxy_cache             off;
            proxy_request_buffering off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            # HTTP/1.1 + empty Connection header are inherited from the server level.
            # Do NOT add proxy_set_header here: it would drop every inherited header
            # (X-Request-Id, traceparent, X-Forwarded-*).
            gzip off;
            chunked_transfer_encoding on;
        }
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=sathi_auth burst=10 nodelay;
        set $sathi_api http://api:8080;
        proxy_pass $sathi_api;
    }

    # Join-code guessing (contracts.md 11.1): counted like auth calls (POST only, per IP).
    location = /api/v1/classes/join {
        limit_req zone=sathi_auth burst=10 nodelay;
        set $sathi_api http://api:8080;
        proxy_pass $sathi_api;
    }

    location = /api/v1/client-errors {
        limit_req zone=sathi_client_errors burst=10 nodelay;
        client_max_body_size 16k;
        set $sathi_api http://api:8080;
        proxy_pass $sathi_api;
    }

    # ------------------------------------------------------------------ Hangfire dashboard
    location ^~ /hangfire {
        set $sathi_jobs http://jobs:8080;
        proxy_pass $sathi_jobs;
    }

    # ------------------------------------------------------------------ static files
    # Never serve dotfiles (except /.well-known).
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Missing assets are real 404s, not index.html.
    location ~* \.(?:js|mjs|css|map|json|webmanifest|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|txt|xml)$ {
        try_files $uri =404;
        access_log off;
    }

    # SPA fallback: every client-side route renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------ named error locations
    location @upstream_unavailable {
        internal;
        default_type application/problem+json;
        return 503 '{"type":"https://sathi.app/errors/service-unavailable","title":"Service temporarily unavailable","status":503,"detail":"Sathi is restarting or temporarily unavailable. Please try again in a moment.","code":"INTERNAL_ERROR","traceId":"$sathi_trace_id","requestId":"$sathi_request_id"}';
    }

    location @rate_limited {
        internal;
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header X-Request-Id $sathi_request_id always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"type":"https://sathi.app/errors/rate-limited","title":"Too many requests","status":429,"detail":"Too many requests. Please wait a minute and try again.","code":"RATE_LIMITED","traceId":"$sathi_trace_id","requestId":"$sathi_request_id"}';
    }
}
