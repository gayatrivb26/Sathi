# Sathi CI (ADR 0011). Every PR and every push to main:
#   infra   compose/promtool/otelcol/nginx static checks
#   secrets gitleaks over the full history
#   dotnet  build + test (.NET 10, Testcontainers use the runner's Docker)
#   python  uv sync, ruff, mypy, pytest with fake providers
#   web     npm ci, build, unit tests, Playwright journeys against mocked API
#   images  docker build of every image + Trivy (fails on CRITICAL)
#   stack   compose.test.yaml smoke test of the whole system (fake AI providers)
#   openapi-breaking  oasdiff breaking-change check of contracts/openapi/*.json vs the PR base (PRs only)
#   e2e     real-stack Playwright suite (tests/e2e) against compose.test.yaml; skipped until it exists
#
# OpenAPI contracts (contracts.md section 11.9): the dotnet and python jobs regenerate
# contracts/openapi/api.v1.json and contracts/openapi/ai-internal.v1.json and fail on drift.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NG_CLI_ANALYTICS: "false"
  # The AI service must never call a paid API in CI.
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: fake
  SEARCH_PROVIDER: fake
  ANTHROPIC_API_KEY: ""
  TAVILY_API_KEY: ""
  BRAVE_API_KEY: ""
  SATHI_ENV: test

jobs:
  # ------------------------------------------------------------------ what exists?
  detect:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.d.outputs.dotnet }}
      python: ${{ steps.d.outputs.python }}
      web: ${{ steps.d.outputs.web }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        name: Detect components
        run: |
          has() { compgen -G "$1" > /dev/null && echo true || echo false; }
          echo "dotnet=$( [ -n "$(git ls-files '*.sln' '*.slnx' '*.csproj')" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "python=$(has 'services/ai-service/pyproject.toml')" >> "$GITHUB_OUTPUT"
          echo "web=$(has 'apps/web/package.json')" >> "$GITHUB_OUTPUT"
          echo "e2e=$(has 'tests/e2e/playwright.config.ts')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ infrastructure config
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks (compose, promtool, otelcol, nginx)
        run: ./scripts/check-monitoring.sh
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh infrastructure/docker/postgres/init/*.sh infrastructure/docker/minio/*.sh

  # ------------------------------------------------------------------ secrets
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.23.3/gitleaks_8.23.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks (full history, config .gitleaks.toml)
        run: gitleaks git --redact --verbose --exit-code 1 .

  # ------------------------------------------------------------------ .NET
  dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Locate solution
        id: sln
        run: |
          sln="$(git ls-files '*.slnx' '*.sln' | head -n1)"
          echo "path=${sln:-services}" >> "$GITHUB_OUTPUT"
          echo "solution: ${sln:-<none, building services/>}"
      - name: Restore
        run: dotnet restore "${{ steps.sln.outputs.path }}"
      - name: Build (also regenerates contracts/openapi/api.v1.json)
        run: dotnet build "${{ steps.sln.outputs.path }}" --no-restore -c Release -warnaserror
      - name: OpenAPI drift - contracts/openapi/api.v1.json must match the build
        run: |
          spec=contracts/openapi/api.v1.json
          if [ ! -f "${spec}" ]; then
            echo "::notice::${spec} is not generated yet (build-time OpenAPI generation not wired) - skipping drift check"
            exit 0
          fi
          if git status --porcelain --untracked-files=all -- "${spec}" | grep -q '^??'; then
            echo "::error file=${spec}::${spec} is generated by the build but not committed. Run 'dotnet build' and commit it."
            exit 1
          fi
          if ! git diff --exit-code -- contracts/openapi; then
            echo "::error file=${spec}::${spec} differs from the code. Run 'dotnet build' locally and commit the regenerated file."
            exit 1
          fi
          echo "${spec} is up to date"
      - name: Test
        run: >
          dotnet test "${{ steps.sln.outputs.path }}" --no-build -c Release
          --logger "trx;LogFilePrefix=results" --results-directory TestResults
          --collect "XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Python AI service
  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sathi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sathi
      # SERVICE_TOKEN_PUBLIC_KEYS is generated per run below (RS256, contracts.md section 11.7).
      LOG_HASH_SALT: ci-only-salt
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ci
      STORAGE_SECRET_KEY: ci-secret-key
      STORAGE_BUCKET: sathi-documents
      PROMPTS_DIR: ${{ github.workspace }}/prompts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-service/uv.lock
      - name: Install Python 3.12 + dependencies
        run: |
          uv python install 3.12
          uv sync --locked --all-extras --dev
      - name: Throw-away service-token key pair (the verifier gets the public key only)
        run: |
          pem="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
          pub="$(printf '%s\n' "${pem}" | openssl pkey -pubout | base64 -w0)"
          echo "SERVICE_TOKEN_PUBLIC_KEYS=k1:${pub}" >> "$GITHUB_ENV"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: pytest (fake LLM / embeddings / search)
        run: uv run pytest -q --junitxml=test-results/junit.xml
      - name: OpenAPI drift - contracts/openapi/ai-internal.v1.json must match the code
        run: |
          spec=../../contracts/openapi/ai-internal.v1.json
          if [ ! -f app/export_openapi.py ] && [ ! -f app/export_openapi/__main__.py ]; then
            echo "::notice::app.export_openapi does not exist yet - skipping drift check"
            exit 0
          fi
          out="$(uv run python -m app.export_openapi)"
          # The module writes the committed file; if it prints the document instead, write it ourselves.
          case "${out}" in "{"*) printf '%s\n' "${out}" > "${spec}" ;; esac
          if git status --porcelain --untracked-files=all -- "${spec}" | grep -q '^??'; then
            echo "::error::contracts/openapi/ai-internal.v1.json is generated but not committed. Run 'uv run python -m app.export_openapi' and commit it."
            exit 1
          fi
          if ! git diff --exit-code -- ../../contracts/openapi; then
            echo "::error::contracts/openapi/ai-internal.v1.json differs from the code. Run 'uv run python -m app.export_openapi' and commit it."
            exit 1
          fi
          echo "ai-internal.v1.json is up to date"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: services/ai-service/test-results
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Angular
  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build (production)
        run: npm run build
      - name: Unit tests
        run: npm run test:ci --if-present
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright journeys (mocked API)
        run: npm run e2e:mock --if-present
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  # ------------------------------------------------------------------ images + Trivy
  images:
    needs: [detect]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web,          dockerfile: apps/web/Dockerfile,               gate: web }
          - { name: api,          dockerfile: services/api/Dockerfile,           gate: dotnet }
          - { name: jobs,         dockerfile: services/jobs/Dockerfile,          gate: dotnet }
          - { name: migrator-app, dockerfile: services/api/Dockerfile.migrator,  gate: dotnet }
          - { name: ai-service,   dockerfile: services/ai-service/Dockerfile,    gate: python }
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the Dockerfile does not exist yet
        id: exists
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::${{ matrix.dockerfile }} not found, skipping"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.ok == 'true'
      - name: Build ${{ matrix.name }}
        if: steps.exists.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: sathi/${{ matrix.name }}:ci
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan (fail on CRITICAL)
        if: steps.exists.outputs.ok == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sathi/${{ matrix.name }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln,secret
      - name: Image runs as non-root
        if: steps.exists.outputs.ok == 'true'
        run: |
          user="$(docker image inspect sathi/${{ matrix.name }}:ci --format '{{.Config.User}}')"
          echo "USER=${user:-<root>}"
          case "${user}" in ""|root|0|0:0) echo "::error::${{ matrix.name }} image runs as root"; exit 1 ;; esac

  # ------------------------------------------------------------------ whole-system smoke test
  stack:
    needs: [detect, infra, images]
    if: needs.detect.outputs.dotnet == 'true' && needs.detect.outputs.python == 'true' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate throw-away secrets
        run: ./scripts/generate-secrets.sh --force
      - name: Start stack (compose.test.yaml, fake AI providers)
        run: docker compose -p sathi-ci -f compose.yaml -f compose.test.yaml up -d --build --wait --wait-timeout 600
      - name: Smoke checks
        run: |
          set -x
          curl -fsS http://localhost:8080/nginx-health
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/api/v1/auth/csrf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)" = "401"
          docker compose -p sathi-ci -f compose.yaml -f compose.test.yaml exec -T api curl -fsS http://127.0.0.1:8080/health/ready
      - name: Seeded secrets never appear in logs
        run: |
          docker compose -p sathi-ci -f compose.yaml -f compose.test.yaml logs --no-color > stack.log 2>&1
          fail=0
          for key in POSTGRES_PASSWORD APP_DB_PASSWORD AI_DB_PASSWORD HANGFIRE_DB_PASSWORD MINIO_ROOT_PASSWORD \
                     STORAGE_APP_SECRET_KEY STORAGE_AI_SECRET_KEY SERVICE_TOKEN_PRIVATE_KEY_PEM_B64 LOG_HASH_SALT SEED_ADMIN_PASSWORD; do
            value="$(grep "^${key}=" .env | cut -d= -f2-)"
            if [ -n "${value}" ] && grep -qF -- "${value}" stack.log; then echo "::error::${key} value found in container logs"; fail=1; fi
          done
          exit "${fail}"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -p sathi-ci -f compose.yaml -f compose.test.yaml logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose -p sathi-ci -f compose.yaml -f compose.test.yaml down -v --remove-orphans

  # ------------------------------------------------------------------ OpenAPI breaking changes (PRs)
  # Compares the committed contracts/openapi/*.json of this PR with the PR's base branch (the
  # drift steps above guarantee the committed files match the code). A spec that does not exist
  # on the base branch yet is skipped. An intentional breaking change is allowed by adding the PR
  # label `openapi-breaking-ok` (the diff is still printed).
  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # tufin/oasdiff v1.32.1 (2026-09-15), pinned by digest.
      OASDIFF_IMAGE: tufin/oasdiff:v1.32.1@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac
      BASE_REF: ${{ github.base_ref }}
      ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'openapi-breaking-ok') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: oasdiff breaking (PR base branch -> this PR)
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          base_dir="${RUNNER_TEMP}/openapi-base"
          mkdir -p "${base_dir}"
          fail=0
          for spec in api.v1.json ai-internal.v1.json; do
            path="contracts/openapi/${spec}"
            if [ ! -f "${path}" ]; then echo "::notice::${path} not in this PR yet - skipped"; continue; fi
            if ! git cat-file -e "origin/${BASE_REF}:${path}" 2>/dev/null; then
              echo "::notice::${path} is new (not on ${BASE_REF}) - nothing to compare"; continue
            fi
            git show "origin/${BASE_REF}:${path}" > "${base_dir}/${spec}"
            echo "== ${spec}"
            if ! docker run --rm -v "${base_dir}:/base:ro" -v "${PWD}/contracts/openapi:/rev:ro" "${OASDIFF_IMAGE}" \
                 breaking "/base/${spec}" "/rev/${spec}" --fail-on ERR; then
              echo "::error file=${path}::breaking API change against ${BASE_REF} (see the log above)"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ] && [ "${ALLOW_BREAKING}" = "true" ]; then
            echo "::warning::breaking OpenAPI change accepted via the 'openapi-breaking-ok' label"
            fail=0
          fi
          exit "${fail}"

  # ------------------------------------------------------------------ real-stack E2E (Playwright)
  # Runs only when tests/e2e/playwright.config.ts exists (detect.e2e); otherwise the job is skipped.
  # Dependencies come from tests/e2e/package.json (preferred) or apps/web/package.json; that
  # node_modules is linked to the repo root so `npx playwright test -c tests/e2e/...` resolves it.
  e2e:
    needs: [detect]
    if: >-
      needs.detect.outputs.e2e == 'true' && needs.detect.outputs.dotnet == 'true' &&
      needs.detect.outputs.python == 'true' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -p sathi-e2e -f compose.yaml -f compose.test.yaml
      BASE_URL: http://localhost:8080
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate throw-away secrets
        run: ./scripts/generate-secrets.sh --force
      - name: Start stack (compose.test.yaml) and wait for health
        run: ${COMPOSE} up -d --build --wait --wait-timeout 900
      - name: Install Playwright
        run: |
          if [ -f tests/e2e/package.json ]; then dir=tests/e2e; else dir=apps/web; fi
          if [ -f "${dir}/package-lock.json" ]; then npm ci --prefix "${dir}"; else npm install --prefix "${dir}"; fi
          ln -sfn "${dir}/node_modules" node_modules
          npx playwright install --with-deps chromium
      - name: Playwright (real stack)
        run: npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: ${COMPOSE} logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: ${COMPOSE} down -v --remove-orphans
